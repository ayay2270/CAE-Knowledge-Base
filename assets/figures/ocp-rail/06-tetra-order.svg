<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-label="圖 6｜Tetra4 vs Tetra10：結果差異怎麼判讀"><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;fill:#223247}.head{font-size:28px;font-weight:700}.sub{font-size:17px}.lab{font-size:20px;font-weight:700}.small{font-size:15px}.pill{font-size:16px;font-weight:700}</style><rect width="1100" height="440" fill="#f8fafc"/><text x="50" y="52" class="head">圖 6｜Tetra4 vs Tetra10：結果差異怎麼判讀</text><line x1="50" y1="72" x2="1050" y2="72" stroke="#cbd5e1" stroke-width="2"/><rect x="52" y="111" width="483" height="268" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><rect x="567" y="111" width="483" height="268" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/><text x="83" y="153" class="lab">一階 Tetra4</text><text x="595" y="153" class="lab">二階 Tetra10</text><polygon points="162,305 295,305 229,185" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/><polygon points="677,305 810,305 744,185" fill="#bbf7d0" stroke="#15803d" stroke-width="4"/><circle cx="162" cy="305" r="9" fill="#2563eb"/><circle cx="295" cy="305" r="9" fill="#2563eb"/><circle cx="229" cy="185" r="9" fill="#2563eb"/><circle cx="677" cy="305" r="8" fill="#15803d"/><circle cx="810" cy="305" r="8" fill="#15803d"/><circle cx="744" cy="185" r="8" fill="#15803d"/><circle cx="743.5" cy="305" r="8" fill="#15803d"/><circle cx="777" cy="245" r="8" fill="#15803d"/><circle cx="710" cy="245" r="8" fill="#15803d"/><text x="83" y="348" class="small">線性位移插值，彎曲與孔邊需較細網格</text><text x="595" y="348" class="small">二次位移插值；接觸面／中點節點亦須檢查</text><text x="245" y="415" text-anchor="middle" class="small">圖示僅為投影概念；不要把二階結果當成無需收斂驗證的真值。</text></svg>
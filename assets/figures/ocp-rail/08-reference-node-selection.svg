<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Measure：選擇實際的驅動參考點（示意圖）</title><desc id="desc">通用選點流程；不保留特定 Node ID。技術示意，非軟體截圖或求解數據。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif}</style><rect width="1100" height="620" fill="#f3f7f8"/><rect width="1100" height="105" fill="#183542"/><text x="30" y="44" font-size="28" fill="#fff">Measure：選擇實際的驅動參考點</text><text x="30" y="82" font-size="18" fill="#dbeaf0">通用選點流程；不保留特定 Node ID</text><rect x="870" y="18" width="200" height="34" rx="17" fill="#f5cb79"/><text x="890" y="42" font-size="19" fill="#183542">方法示意圖</text><rect x="30" y="128" width="505" height="300" rx="14" fill="#fff" stroke="#d5e1e6"/><text x="52" y="172" font-size="28" fill="#0e827b">1  Review RBE3</text><text x="52" y="223" font-size="26" fill="#183542">找 REFGRID 與實體位置</text><text x="52" y="269" font-size="24" fill="#183542">RBE 的 EID ≠ REFGRID</text><text x="52" y="315" font-size="24" fill="#183542">周圍孔壁節點 ≠ 驅動參考點</text><text x="52" y="370" font-size="24" fill="#183542">換網格後重新識別。</text><rect x="565" y="128" width="505" height="300" rx="14" fill="#fff" stroke="#d5e1e6"/><text x="587" y="172" font-size="26" fill="#0e827b">2  Measure → Nodal Contour</text><text x="587" y="223" font-size="24" fill="#183542">Nodes selector → By ID</text><text x="587" y="269" font-size="26" fill="#183542">選當前模型的控制點</text><text x="587" y="315" font-size="24" fill="#183542">Visibility Filter = All</text><text x="587" y="370" font-size="24" fill="#183542">確認只保留所需位置。</text><rect x="30" y="455" width="1040" height="96" rx="14" fill="#fff1df" stroke="#d5e1e6"/><text x="52" y="493" font-size="27" fill="#92521b">先套用 Displacement → Z、共同座標；再查 Value。</text><text x="52" y="531" font-size="22" fill="#92521b">Visibility All 允許選隱藏點，不是全選全部節點；用 Query 交叉核對。</text><text x="30" y="600" font-size="18" fill="#536b77">原創技術示意｜無特定模型 Node ID｜不是 HyperMesh／HyperView 截圖或求解結果</text></svg>

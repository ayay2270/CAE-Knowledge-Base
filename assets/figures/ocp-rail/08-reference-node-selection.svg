<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Measure｜精準選到 RBE3 REFGRID 26088</title><desc id="desc">操作流程示意・非軟體截圖・26088 是本案例值，換網格必須重查。若找不到：查 active model、By Node ID、隱藏篩選、重新編號與該 GRID 是否有輸出。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif;fill:#223247}.title{font-size:27px;font-weight:700}.sub{font-size:17px;fill:#52657a}.body{font-size:20px}.small{font-size:17px}.label{font-size:22px;font-weight:700}.value{font-size:29px;font-weight:700;fill:#0f766e}.number{font-size:19px;font-weight:700;fill:white}.warn{font-size:20px;fill:#9a3412;font-weight:700}</style><rect width="1100" height="620" fill="#f8fafc"/><text x="40" y="48" class="title">Measure｜精準選到 RBE3 REFGRID 26088</text><text x="40" y="80" class="sub">操作流程示意・非軟體截圖・26088 是本案例值，換網格必須重查</text><line x1="40" y1="101" x2="1060" y2="101" stroke="#cbd5e1"/><rect x="40" y="125" width="480" height="410" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="73" cy="164" r="17" fill="#0f766e"/><text x="73" y="170" text-anchor="middle" class="number">1</text><text x="104" y="171" class="label">先 Review RBE3 卡片</text><text x="68" y="219" class="body">EID ≠ REFGRID</text><text x="68" y="253" class="body">REFGRID = 26088</text><text x="68" y="287" class="body">Gi = 孔壁 Nodes，勿誤選</text><text x="68" y="321" class="body">確認 active model 與網格版本</text><rect x="68" y="367" width="424" height="130" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/><text x="86" y="403" class="small">Measure type：Nodal Contour</text><text x="86" y="437" class="small">Entity：Nodes；顯示 Value / Node ID</text><text x="86" y="471" class="small">前提：已 Apply Displacement / Z</text><rect x="550" y="125" width="510" height="410" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="583" cy="164" r="17" fill="#0f766e"/><text x="583" y="170" text-anchor="middle" class="number">2</text><text x="614" y="171" class="label">Nodes selector → By ID</text><text x="580" y="219" class="body">Visibility Filter：All</text><text x="580" y="253" class="body">By Node ID：26088（單一 ID）</text><text x="580" y="287" class="body">確認清單：只保留 Node 26088</text><text x="580" y="321" class="body">依版本 Add / Apply / OK 接受</text><rect x="578" y="367" width="454" height="130" rx="12" fill="#fff7ed" stroke="#cbd5e1"/><text x="596" y="404" class="label">Visibility Filter = All</text><text x="596" y="440" class="small">允許選到隱藏節點</text><text x="596" y="474" class="small">不是點 All 全選整個模型的 Nodes</text><line x1="40" y1="562" x2="1060" y2="562" stroke="#cbd5e1"/><text x="40" y="596" class="small">若找不到：查 active model、By Node ID、隱藏篩選、重新編號與該 GRID 是否有輸出。</text></svg>
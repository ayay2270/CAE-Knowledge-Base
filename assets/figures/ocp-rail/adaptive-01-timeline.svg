<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">01  兩種時間：Subcase 與總載入參數（示意圖）</title><desc id="desc">候選設計：粗增量到 0.75，再以細增量延續到 1.0。技術示意，非軟體截圖或求解數據。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif}</style><rect width="1100" height="620" fill="#f3f7f8"/><rect width="1100" height="105" fill="#183542"/><text x="30" y="44" font-size="28" fill="#fff">01  兩種時間：Subcase 與總載入參數</text><text x="30" y="82" font-size="18" fill="#dbeaf0">候選設計：粗增量到 0.75，再以細增量延續到 1.0</text><rect x="870" y="18" width="200" height="34" rx="17" fill="#f5cb79"/><text x="890" y="42" font-size="19" fill="#183542">待驗證・示意圖</text><rect x="30" y="125" width="650" height="110" rx="14" fill="#e5f4ee" stroke="#d5e1e6"/><text x="50" y="162" font-size="26" fill="#183542">Stage 1｜局部 0 → 0.75</text><text x="50" y="204" font-size="23" fill="#183542">TTERM=.75   NINC=8   初始 Δt=.09375</text><rect x="700" y="125" width="370" height="110" rx="14" fill="#e5eefc" stroke="#d5e1e6"/><text x="720" y="162" font-size="24" fill="#183542">Stage 2｜局部 0 → 0.25</text><text x="720" y="204" font-size="24" fill="#183542">初始 Δt≈.00694444</text><path d="M65 250 L65 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M143 250 L143 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M221 250 L221 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M299 250 L299 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M377 250 L377 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M455 250 L455 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M533 250 L533 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M611 250 L611 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M689 250 L689 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M698 250 L698 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M707 250 L707 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M716 250 L716 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M725 250 L725 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M734 250 L734 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M743 250 L743 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M752 250 L752 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M761 250 L761 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M770 250 L770 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M779 250 L779 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M788 250 L788 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M797 250 L797 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M806 250 L806 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M815 250 L815 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M824 250 L824 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M833 250 L833 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M842 250 L842 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M851 250 L851 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M860 250 L860 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M869 250 L869 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M878 250 L878 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M887 250 L887 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M896 250 L896 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M905 250 L905 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M914 250 L914 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M923 250 L923 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M932 250 L932 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M941 250 L941 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M950 250 L950 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M959 250 L959 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M968 250 L968 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M977 250 L977 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M986 250 L986 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M995 250 L995 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M1004 250 L1004 281" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M1013 250 L1013 281" fill="none" stroke="#0e827b" stroke-width="3" /><text x="60" y="316" font-size="22" fill="#183542">總時間 0</text><text x="604" y="316" font-size="22" fill="#183542">0.75</text><text x="984" y="316" font-size="22" fill="#183542">1.0</text><path d="M65 280 L1013 280" fill="none" stroke="#7f98a5" stroke-width="3" /><rect x="30" y="350" width="1040" height="95" rx="14" fill="#fff" stroke="#d5e1e6"/><text x="52" y="387" font-size="25" fill="#183542">Stage 2 的 TTERM 是 0.25；續接後設計總時間為 0.75 + 0.25 = 1.0</text><text x="52" y="423" font-size="21" fill="#183542">刻線只表達粗／細配置；自適應實際步數可能因 cutback／growth 改變。</text><rect x="30" y="467" width="1040" height="82" rx="14" fill="#fff1df" stroke="#d5e1e6"/><text x="52" y="501" font-size="26" fill="#92521b">時間長度 ≠ SPCD 位移倍率；需要另外明定 u(t) 曲線。</text><text x="52" y="533" font-size="20" fill="#92521b">門檻若落在粗增量區，就把細化起點往前移；不保證 60 MPa 發生在最後一段。</text><text x="30" y="600" font-size="18" fill="#536b77">原創技術示意｜無特定模型 Node ID｜不是 HyperMesh／HyperView 截圖或求解結果</text></svg>

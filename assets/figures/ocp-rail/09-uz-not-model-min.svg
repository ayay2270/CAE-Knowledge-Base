<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">控制量｜Reference Node UZ 不能用模型極值代替</title><desc id="desc">既有案例數值重繪・非原始結果截圖・沒有新增求解。Nodal Contour 跟隨目前 contour；切換 Stress 後，原量測值不再代表 UZ。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif;fill:#223247}.title{font-size:27px;font-weight:700}.sub{font-size:17px;fill:#52657a}.body{font-size:20px}.small{font-size:17px}.label{font-size:22px;font-weight:700}.value{font-size:29px;font-weight:700;fill:#0f766e}.number{font-size:19px;font-weight:700;fill:white}.warn{font-size:20px;fill:#9a3412;font-weight:700}</style><rect width="1100" height="620" fill="#f8fafc"/><text x="40" y="48" class="title">控制量｜Reference Node UZ 不能用模型極值代替</text><text x="40" y="80" class="sub">既有案例數值重繪・非原始結果截圖・沒有新增求解</text><line x1="40" y1="101" x2="1060" y2="101" stroke="#cbd5e1"/><rect x="40" y="128" width="1020" height="115" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/><circle cx="74" cy="163" r="17" fill="#0f766e"/><text x="74" y="169" text-anchor="middle" class="number">1</text><text x="107" y="171" class="label">正確控制點：RBE3 REFGRID 26088</text><text x="75" y="216" class="value">Global UZ = −1.101 mm</text><text x="646" y="213" class="label">SPCD 的目標來源</text><rect x="40" y="265" width="1020" height="103" rx="12" fill="#fff7ed" stroke="#cbd5e1"/><text x="68" y="304" class="label">全模型最小 UZ = −1.379 mm</text><text x="68" y="342" class="body">另一實體位置的極值；若誤套，負向行程多 0.278 mm。</text><rect x="40" y="390" width="1020" height="131" rx="12" fill="#eaf2fc" stroke="#cbd5e1"/><text x="68" y="431" class="label">Max |U|：Force ≈ 2.947 mm ／ SPCD ≈ 2.948 mm</text><text x="68" y="471" class="small">向量長度的最大值，皆位於 Grid 1345；不能當成負 Z 行程。</text><text x="68" y="505" class="small">位移場差約 0.034% 是既有紀錄；反力約 490 N 仍待 SPCFORCE 核實。</text><line x1="40" y1="562" x2="1060" y2="562" stroke="#cbd5e1"/><text x="40" y="596" class="small">Nodal Contour 跟隨目前 contour；切換 Stress 後，原量測值不再代表 UZ。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">設定對照｜SPC 宣告 DOF；SPCD 指定位移</title><desc id="desc">設定示意・非軟體截圖・前提：NLSTAT + LGDISP，確認有效 GRID CD 方向。SID 100／200 是示例；RBE3 REFGRID 上 SPC 的 LGDISP 適用條件需依版本核對。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif;fill:#223247}.title{font-size:27px;font-weight:700}.sub{font-size:17px;fill:#52657a}.body{font-size:20px}.small{font-size:17px}.label{font-size:22px;font-weight:700}.value{font-size:29px;font-weight:700;fill:#0f766e}.number{font-size:19px;font-weight:700;fill:white}.warn{font-size:20px;fill:#9a3412;font-weight:700}</style><rect width="1100" height="620" fill="#f8fafc"/><text x="40" y="48" class="title">設定對照｜SPC 宣告 DOF；SPCD 指定位移</text><text x="40" y="80" class="sub">設定示意・非軟體截圖・前提：NLSTAT + LGDISP，確認有效 GRID CD 方向</text><line x1="40" y1="101" x2="1060" y2="101" stroke="#cbd5e1"/><rect x="40" y="130" width="320" height="280" rx="12" fill="#eaf2fc" stroke="#cbd5e1"/><text x="64" y="173" class="label">SPC set：SID 100</text><text x="64" y="220" class="body">右端 Node 支承點</text><text x="64" y="254" class="body">SPC 123456 = 0</text><text x="64" y="288" class="body">左端 Node 驅動點</text><text x="64" y="322" class="body">只 SPC 3 = 0</text><rect x="390" y="130" width="320" height="280" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/><text x="414" y="173" class="label">SPCD：SID 200</text><text x="414" y="220" class="body">Node：驅動點</text><text x="414" y="254" class="body">Component：3</text><text x="414" y="288" class="body">D：u_ref</text><text x="414" y="322" class="body">原 actuator FORCE 停用</text><rect x="740" y="130" width="320" height="280" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="764" y="173" class="label">同一 Load Step</text><text x="764" y="220" class="body">SPC = 100</text><text x="764" y="254" class="body">LOAD = 200</text><text x="764" y="288" class="body">保留材料／Contact</text><text x="764" y="322" class="body">保留非線性控制設定</text><rect x="40" y="435" width="1020" height="100" rx="12" fill="#fff7ed" stroke="#cbd5e1"/><text x="64" y="473" class="body">SPC 的 0 是宣告；SPCD 給同一 DOF 非零行程，不互相抵銷。</text><text x="64" y="507" class="body">LOAD = 200 直接選 SPCD；不要用 Bulk Data LOAD combination 包住 SPCD。</text><line x1="40" y1="562" x2="1060" y2="562" stroke="#cbd5e1"/><text x="40" y="596" class="small">SID 100／200 是示例；RBE3 REFGRID 上 SPC 的 LGDISP 適用條件需依版本核對。</text></svg>

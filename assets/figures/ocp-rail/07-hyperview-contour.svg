<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">HyperView｜先固定結果，再量指定節點</title><desc id="desc">操作欄位示意・非軟體截圖・介面位置依版本而異。每次留存 model、subcase、已收斂 frame、分量、座標系與 N–mm 單位。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif;fill:#223247}.title{font-size:27px;font-weight:700}.sub{font-size:17px;fill:#52657a}.body{font-size:20px}.small{font-size:17px}.label{font-size:22px;font-weight:700}.value{font-size:29px;font-weight:700;fill:#0f766e}.number{font-size:19px;font-weight:700;fill:white}.warn{font-size:20px;fill:#9a3412;font-weight:700}</style><rect width="1100" height="620" fill="#f8fafc"/><text x="40" y="48" class="title">HyperView｜先固定結果，再量指定節點</text><text x="40" y="80" class="sub">操作欄位示意・非軟體截圖・介面位置依版本而異</text><line x1="40" y1="101" x2="1060" y2="101" stroke="#cbd5e1"/><rect x="40" y="125" width="370" height="405" rx="12" fill="#eaf2fc" stroke="#cbd5e1"/><text x="66" y="165" class="label">① Model / Loadcase / Frame</text><text x="66" y="210" class="body">Model：Force 基準的同版模型</text><text x="66" y="244" class="body">Subcase：Force −490 N</text><text x="66" y="278" class="body">Frame：完整載荷已收斂增量</text><text x="66" y="312" class="body">排除：跨步 Envelope</text><text x="66" y="346" class="body">查 .out：完成、載荷比例</text><text x="66" y="474" class="warn">最後一張 ≠ 必然已達完整載荷</text><rect x="440" y="125" width="620" height="405" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="468" y="165" class="label">② Contour → Apply</text><text x="468" y="213" class="body">Result type             Displacement</text><text x="468" y="247" class="body">Data component       Z</text><text x="468" y="281" class="body">Resolved in              Global System</text><text x="468" y="315" class="body">Apply                      套用目前結果</text><rect x="468" y="364" width="560" height="130" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/><text x="488" y="400" class="small">讀值目標：指定 Node 的 UZ</text><text x="488" y="434" class="small">不是：Magnitude、Position Z 或 Stress</text><text x="488" y="468" class="small">注意：GRID CD 與顯示座標必須對齊</text><line x1="40" y1="562" x2="1060" y2="562" stroke="#cbd5e1"/><text x="40" y="596" class="small">每次留存 model、subcase、已收斂 frame、分量、座標系與 N–mm 單位。</text></svg>
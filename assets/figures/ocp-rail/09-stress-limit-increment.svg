<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">03  找首次超限的已儲存增量（示意圖）</title><desc id="desc">依載入順序判斷；先保留前後兩幀，再加密求解驗證 非軟體截圖，非實際求解結果。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif}.ink{fill:#17333f}.muted{fill:#506773}.white{fill:#fff}.teal{fill:#e6f5f0}.dark{fill:#17333f}.accent{fill:#0c827b}.warn{fill:#fff1df}.orange{fill:#96521d}.mono{font-family:Consolas,monospace;fill:#17333f}</style><rect width="960" height="600" fill="#f1f5f6"/><rect width="960" height="112" fill="#17333f"/><text x="32" y="45" class="white" font-size="27">03  找首次超限的已儲存增量</text><text x="32" y="84" class="white" font-size="18">依載入順序判斷；先保留前後兩幀，再加密求解驗證</text><rect x="788" y="20" width="140" height="32" rx="16" fill="#f5c877"/><text x="806" y="43" class="ink" font-size="19">示意圖</text><rect x="28" y="135" width="904" height="249" rx="14" class="white"/><text x="50" y="175" class="accent" font-size="23">固定評估設定：Rail 範圍／應力種類／結果位置／Averaging</text><path d="M100 328 L854 328" fill="none" stroke="#8aa2ac" stroke-width="3" /><path d="M100 206 L100 328" fill="none" stroke="#8aa2ac" stroke-width="3" /><path d="M100 242 L854 242" fill="none" stroke="#bb7236" stroke-width="3" stroke-dasharray="7 6"/><text x="725" y="231" class="orange" font-size="20">60 MPa 門檻</text><path d="M120 318 Q260 308 380 278 T570 253 Q650 236 715 214 T825 201" fill="none" stroke="#0c827b" stroke-width="4"/><circle cx="570" cy="253" r="7" fill="#0c827b"/><circle cx="715" cy="214" r="8" fill="#bb7236"/><text x="450" y="302" class="ink" font-size="22">i−1：&lt; 60</text><text x="673" y="282" class="orange" font-size="22">i：≥ 60</text><text x="600" y="363" class="muted" font-size="20">Time／位移（無數值刻度）</text><rect x="28" y="405" width="904" height="79" rx="14" class="teal"/><text x="50" y="438" class="accent" font-size="24">在 i 讀 Stress_i → UZ_i → RZ_i，不能拿其他幀的反力換算。</text><text x="50" y="469" class="ink" font-size="20">第一個「儲存」超限幀不是精確門檻；i−1 到 i 附近重跑更細步長。</text><text x="50" y="522" class="orange" font-size="21">曲線僅示意、不是本案數據；實際反力可能非單調，須按載入順序尋找。</text><text x="32" y="577" class="muted" font-size="17">工程流程示意｜不是 HyperView 截圖，也不是本案新求解數據</text></svg>
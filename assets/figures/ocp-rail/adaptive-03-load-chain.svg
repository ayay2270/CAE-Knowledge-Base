<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">03  候選載入鏈：明確的總時間曲線（示意圖）</title><desc id="desc">文件支援的卡片組合；完整兩階段行為仍待最小模型驗證。技術示意，非軟體截圖或求解數據。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif}</style><rect width="1100" height="620" fill="#f3f7f8"/><rect width="1100" height="105" fill="#183542"/><text x="30" y="44" font-size="28" fill="#fff">03  候選載入鏈：明確的總時間曲線</text><text x="30" y="82" font-size="18" fill="#dbeaf0">文件支援的卡片組合；完整兩階段行為仍待最小模型驗證</text><rect x="870" y="18" width="200" height="34" rx="17" fill="#f5cb79"/><text x="890" y="42" font-size="19" fill="#183542">待驗證・示意圖</text><rect x="30" y="128" width="220" height="115" rx="14" fill="#e5f4ee" stroke="#d5e1e6"/><text x="50" y="165" font-size="28" fill="#183542">SPCD</text><text x="50" y="205" font-size="23" fill="#183542">基底行程 u_T</text><rect x="285" y="128" width="235" height="115" rx="14" fill="#fff" stroke="#d5e1e6"/><text x="305" y="165" font-size="28" fill="#183542">TLOAD1</text><text x="305" y="205" font-size="23" fill="#183542">TYPE = DISP</text><rect x="555" y="128" width="235" height="115" rx="14" fill="#fff" stroke="#d5e1e6"/><text x="575" y="165" font-size="28" fill="#183542">DLOAD</text><text x="575" y="205" font-size="23" fill="#183542">選用 TLOAD1</text><rect x="825" y="128" width="245" height="115" rx="14" fill="#e5eefc" stroke="#d5e1e6"/><text x="845" y="165" font-size="26" fill="#183542">兩個 Subcase</text><text x="845" y="205" font-size="23" fill="#183542">選同一 DLOAD</text><path d="M250 185 L285 185" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M520 185 L555 185" fill="none" stroke="#0e827b" stroke-width="3" /><path d="M790 185 L825 185" fill="none" stroke="#0e827b" stroke-width="3" /><rect x="30" y="270" width="1040" height="125" rx="14" fill="#fff" stroke="#d5e1e6"/><text x="52" y="309" font-size="26" fill="#0e827b">TLOAD1 → TABLED1；TSTIME = TOT（介面可見 TOTAL）</text><text x="52" y="352" font-size="25" fill="#183542">總時間</text><text x="400" y="352" font-size="25" fill="#183542">0</text><text x="650" y="352" font-size="25" fill="#183542">0.75</text><text x="900" y="352" font-size="25" fill="#183542">1.0</text><text x="52" y="383" font-size="25" fill="#183542">位移倍率</text><text x="400" y="383" font-size="25" fill="#183542">0</text><text x="650" y="383" font-size="25" fill="#183542">0.75</text><text x="900" y="383" font-size="25" fill="#183542">1.0</text><rect x="30" y="419" width="1040" height="137" rx="14" fill="#fff1df" stroke="#d5e1e6"/><text x="52" y="454" font-size="26" fill="#92521b">設計意圖：u(t) = t × u_T；邊界位移應連續。</text><text x="52" y="490" font-size="21" fill="#92521b">不能只靠 TTERM=.75 就宣稱位移是 .75u_T；也不能把第二段填成增量 .25u_T。</text><text x="52" y="527" font-size="21" fill="#92521b">D=F 是保持已變形邊界；移除前段 SPC／SPCD 可能造成卸載，均非繼續拉伸。</text><text x="30" y="600" font-size="18" fill="#536b77">原創技術示意｜無特定模型 Node ID｜不是 HyperMesh／HyperView 截圖或求解結果</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">02  三個控制量，不可互相取代（示意圖）</title><desc id="desc">Model Browser → Create → Load Step Inputs → Entity Editor。技術示意，非軟體截圖或求解數據。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif}</style><rect width="1100" height="620" fill="#f3f7f8"/><rect width="1100" height="105" fill="#183542"/><text x="30" y="44" font-size="28" fill="#fff">02  三個控制量，不可互相取代</text><text x="30" y="82" font-size="18" fill="#dbeaf0">Model Browser → Create → Load Step Inputs → Entity Editor</text><rect x="870" y="18" width="200" height="34" rx="17" fill="#f5cb79"/><text x="890" y="42" font-size="19" fill="#183542">待驗證・示意圖</text><rect x="30" y="128" width="1040" height="97" rx="14" fill="#fff" stroke="#d5e1e6"/><text x="50" y="166" font-size="26" fill="#0e827b">NLPARM｜NINC</text><text x="410" y="166" font-size="26" fill="#183542">DT 留白：初始 Δt = TTERM / NINC</text><text x="410" y="203" font-size="21" fill="#183542">另設 DT 時，NINC 會被忽略。</text><rect x="30" y="245" width="1040" height="97" rx="14" fill="#fff" stroke="#d5e1e6"/><text x="50" y="283" font-size="26" fill="#0e827b">NLADAPT｜DTMAX</text><text x="410" y="283" font-size="26" fill="#183542">自適應增量上限；DIRECT = NO</text><text x="410" y="320" font-size="21" fill="#183542">不是固定步長，也不是保證最終步數。</text><rect x="30" y="362" width="1040" height="97" rx="14" fill="#fff" stroke="#d5e1e6"/><text x="50" y="400" font-size="26" fill="#0e827b">NLOUT｜FREQ</text><text x="410" y="400" font-size="26" fill="#183542">每隔幾個載荷層級儲存一次</text><text x="410" y="437" font-size="21" fill="#183542">FREQ = 1 不會讓求解自動變細。</text><rect x="30" y="479" width="1040" height="74" rx="14" fill="#fff1df" stroke="#d5e1e6"/><text x="52" y="511" font-size="26" fill="#92521b">□ VALUE REAL 不勾     →     FREQ 使用整數 1</text><text x="52" y="540" font-size="20" fill="#92521b">以匯出 NLOUT 卡片與 2026 安裝版介面為準；不是時間間隔或 Hz。</text><text x="30" y="600" font-size="18" fill="#536b77">原創技術示意｜無特定模型 Node ID｜不是 HyperMesh／HyperView 截圖或求解結果</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-label="圖 2｜RBE 選孔壁節點，不是只選孔口上緣"><style>text{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;fill:#223247}.head{font-size:28px;font-weight:700}.sub{font-size:17px}.lab{font-size:20px;font-weight:700}.small{font-size:15px}.pill{font-size:16px;font-weight:700}</style><rect width="1100" height="440" fill="#f8fafc"/><text x="50" y="52" class="head">圖 2｜RBE 選孔壁節點，不是只選孔口上緣</text><line x1="50" y1="72" x2="1050" y2="72" stroke="#cbd5e1" stroke-width="2"/><rect x="60" y="105" width="475" height="270" rx="16" fill="#eaf2fc" stroke="#94a3b8" stroke-width="2"/><rect x="570" y="105" width="475" height="270" rx="16" fill="#ecfdf5" stroke="#94a3b8" stroke-width="2"/><text x="88" y="145" class="lab">錯誤風險：只有上緣一圈</text><text x="592" y="145" class="lab">建議：沿孔壁深度選取</text><ellipse cx="286" cy="221" rx="86" ry="38" fill="#536c47"/><path d="M200 221v77q86 55 172 0v-77" fill="#6c8849" stroke="#41552f" stroke-width="3"/><ellipse cx="286" cy="221" rx="85" ry="38" fill="none" stroke="#ef4444" stroke-width="6"/><ellipse cx="803" cy="221" rx="86" ry="38" fill="#536c47"/><path d="M717 221v77q86 55 172 0v-77" fill="#6c8849" stroke="#41552f" stroke-width="3"/><ellipse cx="803" cy="221" rx="84" ry="37" fill="none" stroke="#ef4444" stroke-width="4"/><path d="M718 261q85 75 170 0M718 298q85 75 170 0" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="8 9"/><text x="96" y="351" class="small">水平 Pin 承壓只由孔口帶入 → 局部集中</text><text x="602" y="351" class="small">需與實際 Pin 接觸面／承壓側一致</text></svg>
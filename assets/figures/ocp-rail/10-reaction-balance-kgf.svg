<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">04  先算治具合力，再換算 kgf（示意圖）</title><desc id="desc">同方向、同座標、同增量；保留正負號檢查平衡 非軟體截圖，非實際求解結果。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif}.ink{fill:#17333f}.muted{fill:#506773}.white{fill:#fff}.teal{fill:#e6f5f0}.dark{fill:#17333f}.accent{fill:#0c827b}.warn{fill:#fff1df}.orange{fill:#96521d}.mono{font-family:Consolas,monospace;fill:#17333f}</style><rect width="960" height="600" fill="#f1f5f6"/><rect width="960" height="112" fill="#17333f"/><text x="32" y="45" class="white" font-size="27">04  先算治具合力，再換算 kgf</text><text x="32" y="84" class="white" font-size="18">同方向、同座標、同增量；保留正負號檢查平衡</text><rect x="788" y="20" width="140" height="32" rx="16" fill="#f5c877"/><text x="806" y="43" class="ink" font-size="19">示意圖</text><rect x="28" y="135" width="904" height="153" rx="14" class="white"/><text x="50" y="176" class="accent" font-size="27">單一驅動點：F_limit = |RZ_i| / 9.80665  kgf</text><text x="50" y="219" class="ink" font-size="23">多個驅動點：先在同一治具加總帶符號 Z 分量，再取絕對值</text><text x="50" y="261" class="muted" font-size="21">若載入方向不是 Global Z，使用共同載入方向的力投影。</text><rect x="28" y="308" width="440" height="146" rx="14" class="white"/><text x="50" y="348" class="accent" font-size="22">簡單雙端 SPCD、無其他外力</text><text x="50" y="391" class="mono" font-size="22">RZ_drive + RZ_support ≈ 0</text><text x="50" y="432" class="ink" font-size="21">不能加總兩端的絕對值當拉力</text><rect x="490" y="308" width="442" height="146" rx="14" class="white"/><text x="512" y="348" class="accent" font-size="22">單位換算示例（非量測值）</text><text x="512" y="391" class="mono" font-size="25">50 kgf = 490.3325 N</text><text x="512" y="432" class="ink" font-size="21">約 490 N；不是 50 kg 的質量</text><rect x="28" y="475" width="904" height="68" rx="14" class="warn"/><text x="50" y="503" class="orange" font-size="21">避免把 RBE 中心、孔壁傳力與支承重複相加；多外力須完整力平衡。</text><text x="50" y="530" class="orange" font-size="19">結論名稱：Predicted Load at 60 MPa Stress Limit；不是已驗證 Crack Load。</text><text x="32" y="577" class="muted" font-size="17">工程流程示意｜不是 HyperView 截圖，也不是本案新求解數據</text></svg>
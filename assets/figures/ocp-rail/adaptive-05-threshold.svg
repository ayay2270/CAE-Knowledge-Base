<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">05  同一增量：Stress → 位移 → SPCFORCE（示意圖）</title><desc id="desc">按載入順序找首次儲存且收斂的超限解；門檻載荷不是 Crack Load。技術示意，非軟體截圖或求解數據。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif}</style><rect width="1100" height="620" fill="#f3f7f8"/><rect width="1100" height="105" fill="#183542"/><text x="30" y="44" font-size="28" fill="#fff">05  同一增量：Stress → 位移 → SPCFORCE</text><text x="30" y="82" font-size="18" fill="#dbeaf0">按載入順序找首次儲存且收斂的超限解；門檻載荷不是 Crack Load</text><rect x="870" y="18" width="200" height="34" rx="17" fill="#f5cb79"/><text x="890" y="42" font-size="19" fill="#183542">待驗證・示意圖</text><rect x="30" y="128" width="1040" height="200" rx="14" fill="#fff" stroke="#d5e1e6"/><text x="52" y="170" font-size="27" fill="#0e827b">前一增量 i−1</text><text x="570" y="170" font-size="27" fill="#92521b">首次超限增量 i</text><text x="52" y="219" font-size="27" fill="#183542">評估應力 &lt; 60 MPa</text><text x="570" y="219" font-size="27" fill="#183542">評估應力 ≥ 60 MPa</text><text x="52" y="267" font-size="23" fill="#183542">保留時間、位移、反力</text><text x="570" y="267" font-size="23" fill="#183542">同一 Subcase／Frame 讀反力</text><path d="M460 220 L530 220" fill="none" stroke="#0e827b" stroke-width="3" /><rect x="30" y="352" width="1040" height="103" rx="14" fill="#e5f4ee" stroke="#d5e1e6"/><text x="52" y="392" font-size="30" fill="#0e827b">F_limit (kgf) = |R_drive,i| / 9.80665</text><text x="52" y="431" font-size="22" fill="#183542">多點驅動先加總同方向帶符號分量；不要把左右兩端或內部接觸重複計入。</text><rect x="30" y="478" width="1040" height="79" rx="14" fill="#fff1df" stroke="#d5e1e6"/><text x="52" y="510" font-size="25" fill="#92521b">同一應力種類／位置／Averaging；只用收斂解，核對力平衡。</text><text x="52" y="541" font-size="21" fill="#92521b">門檻附近再細化並做網格收斂；數值表保持待填，不虛構工程載荷。</text><text x="30" y="600" font-size="18" fill="#536b77">原創技術示意｜無特定模型 Node ID｜不是 HyperMesh／HyperView 截圖或求解結果</text></svg>

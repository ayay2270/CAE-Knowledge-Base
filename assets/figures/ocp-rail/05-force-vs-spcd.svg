<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Force → SPCD：量測與驗證的通用流程（示意圖）</title><desc id="desc">方法示意，保留操作邏輯與證據需求。技術示意，非軟體截圖或求解數據。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif}</style><rect width="1100" height="620" fill="#f3f7f8"/><rect width="1100" height="105" fill="#183542"/><text x="30" y="44" font-size="28" fill="#fff">Force → SPCD：量測與驗證的通用流程</text><text x="30" y="82" font-size="18" fill="#dbeaf0">方法示意，保留操作邏輯與證據需求</text><rect x="870" y="18" width="200" height="34" rx="17" fill="#f5cb79"/><text x="890" y="42" font-size="19" fill="#183542">方法示意圖</text><rect x="30" y="128" width="1040" height="110" rx="14" fill="#e5f4ee" stroke="#d5e1e6"/><text x="52" y="171" font-size="28" fill="#183542">正確控制量：實際驅動位置、同一方向、同一座標的 u_ref</text><text x="52" y="214" font-size="24" fill="#183542">在目標 Force 基準的已收斂結果量測，再以 SPCD 重現。</text><rect x="30" y="264" width="1040" height="110" rx="14" fill="#fff" stroke="#d5e1e6"/><text x="52" y="307" font-size="27" fill="#183542">不以全模型 Min UZ／Max Magnitude／Position Z 代替</text><text x="52" y="350" font-size="24" fill="#183542">它們代表其他位置或其他物理量，不能直接當作驅動行程。</text><rect x="30" y="402" width="1040" height="150" rx="14" fill="#fff1df" stroke="#d5e1e6"/><text x="52" y="444" font-size="27" fill="#92521b">驗證等效：位移場 + 驅動反力 + 平衡 + 接觸／材料歷程</text><text x="52" y="487" font-size="23" fill="#92521b">沒有特定模型的數值結論；先定義專案容許誤差，再保存實際結果。</text><text x="52" y="528" font-size="23" fill="#92521b">節點編號依當前網格識別，本圖不列任何案例編號或單點讀值。</text><text x="30" y="600" font-size="18" fill="#536b77">原創技術示意｜無特定模型 Node ID｜不是 HyperMesh／HyperView 截圖或求解結果</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">04  匯出 deck：逐段核對選集與順序（示意圖）</title><desc id="desc">兩段同為 NLSTAT + LGDISP；欄位名稱依安裝版與 Profile 核對。技術示意，非軟體截圖或求解數據。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif}</style><rect width="1100" height="620" fill="#f3f7f8"/><rect width="1100" height="105" fill="#183542"/><text x="30" y="44" font-size="28" fill="#fff">04  匯出 deck：逐段核對選集與順序</text><text x="30" y="82" font-size="18" fill="#dbeaf0">兩段同為 NLSTAT + LGDISP；欄位名稱依安裝版與 Profile 核對</text><rect x="870" y="18" width="200" height="34" rx="17" fill="#f5cb79"/><text x="890" y="42" font-size="19" fill="#183542">待驗證・示意圖</text><rect x="30" y="128" width="505" height="323" rx="14" fill="#e5f4ee" stroke="#d5e1e6"/><text x="52" y="168" font-size="28" fill="#0e827b">Stage1_Coarse</text><text x="52" y="215" font-size="24" fill="#183542">NLPARM：TTERM=.75，NINC=8</text><text x="52" y="258" font-size="23" fill="#183542">NLADAPT：DTMAX=.1，DIRECT=NO</text><text x="52" y="301" font-size="24" fill="#183542">NLOUT：FREQ=1（整數）</text><text x="52" y="344" font-size="24" fill="#183542">SPC：共同的實際治具約束</text><text x="52" y="387" font-size="23" fill="#183542">DLOAD：共同的總時間位移曲線</text><rect x="565" y="128" width="505" height="323" rx="14" fill="#e5eefc" stroke="#d5e1e6"/><text x="587" y="168" font-size="28" fill="#0e827b">Stage2_Fine</text><text x="587" y="215" font-size="23" fill="#183542">NLPARM：TTERM=.25，NINC=36</text><text x="587" y="258" font-size="21" fill="#183542">NLADAPT：DTMAX=.007，DIRECT=NO</text><text x="587" y="301" font-size="24" fill="#183542">NLOUT：FREQ=1（整數）</text><text x="587" y="344" font-size="23" fill="#183542">SPC／DLOAD：維持同一載入鏈</text><text x="587" y="387" font-size="27" fill="#183542">CNTNLSUB = YES</text><rect x="30" y="475" width="1040" height="79" rx="14" fill="#fff1df" stroke="#d5e1e6"/><text x="52" y="508" font-size="25" fill="#92521b">YES 接 deck 中前一個同型非線性 Subcase；不是「編號減一」。</text><text x="52" y="539" font-size="20" fill="#92521b">查 DT 是否仍有值、ID 是否選錯、全域 CNTNLSUB 是否意外作用，以及有無 LOAD 重複。</text><text x="30" y="600" font-size="18" fill="#536b77">原創技術示意｜無特定模型 Node ID｜不是 HyperMesh／HyperView 截圖或求解結果</text></svg>

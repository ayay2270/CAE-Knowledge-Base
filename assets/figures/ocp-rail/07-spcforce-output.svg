<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">01  設定反力與中間增量輸出（示意圖）</title><desc id="desc">先檢查匯出的 .fem，再檢查 H3D 的結果與增量 非軟體截圖，非實際求解結果。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif}.ink{fill:#17333f}.muted{fill:#506773}.white{fill:#fff}.teal{fill:#e6f5f0}.dark{fill:#17333f}.accent{fill:#0c827b}.warn{fill:#fff1df}.orange{fill:#96521d}.mono{font-family:Consolas,monospace;fill:#17333f}</style><rect width="960" height="600" fill="#f1f5f6"/><rect width="960" height="112" fill="#17333f"/><text x="32" y="45" class="white" font-size="27">01  設定反力與中間增量輸出</text><text x="32" y="84" class="white" font-size="18">先檢查匯出的 .fem，再檢查 H3D 的結果與增量</text><rect x="788" y="20" width="140" height="32" rx="16" fill="#f5c877"/><text x="806" y="43" class="ink" font-size="19">示意圖</text><rect x="28" y="134" width="440" height="314" rx="14" class="white"/><text x="50" y="172" class="accent" font-size="24">Output Request</text><text x="50" y="215" class="mono" font-size="24">SPCFORCE(H3D) = ALL</text><text x="50" y="260" class="mono" font-size="21">DISPLACEMENT(H3D) = ALL</text><text x="50" y="304" class="mono" font-size="24">STRESS(H3D) = ALL</text><text x="50" y="353" class="ink" font-size="21">保持 NLSTAT + 既有 LGDISP</text><text x="50" y="398" class="muted" font-size="19">ALL 是節點範圍，不是全部增量</text><rect x="490" y="134" width="442" height="314" rx="14" class="white"/><text x="512" y="172" class="accent" font-size="23">NLOUT：在目標 Subcase 選用</text><text x="512" y="215" class="mono" font-size="24">NLOUT = 9001</text><text x="512" y="259" class="muted" font-size="21">Bulk Data（示例 ID）</text><text x="512" y="302" class="mono" font-size="24">NLOUT,9001,FREQ,1,</text><text x="512" y="336" class="mono" font-size="24">      SVNONCNV,NO</text><text x="512" y="398" class="ink" font-size="21">FREQ=1：逐收斂增量儲存</text><rect x="28" y="468" width="904" height="73" rx="14" class="warn"/><text x="50" y="498" class="orange" font-size="21">只增加輸出密度，不會縮小求解步長。門檻附近須另外加密求解增量。</text><text x="50" y="526" class="orange" font-size="19">ID 要對應，檢查後續衝突卡；SPCFORCE／應力／位移須有相同增量。</text><text x="32" y="577" class="muted" font-size="17">工程流程示意｜不是 HyperView 截圖，也不是本案新求解數據</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">02  同一個 Frame，查同一個驅動 Node（示意圖）</title><desc id="desc">Subcase + Frame／Time + 檔案版本，三者一起記錄 非軟體截圖，非實際求解結果。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif}.ink{fill:#17333f}.muted{fill:#506773}.white{fill:#fff}.teal{fill:#e6f5f0}.dark{fill:#17333f}.accent{fill:#0c827b}.warn{fill:#fff1df}.orange{fill:#96521d}.mono{font-family:Consolas,monospace;fill:#17333f}</style><rect width="960" height="600" fill="#f1f5f6"/><rect width="960" height="112" fill="#17333f"/><text x="32" y="45" class="white" font-size="27">02  同一個 Frame，查同一個驅動 Node</text><text x="32" y="84" class="white" font-size="18">Subcase + Frame／Time + 檔案版本，三者一起記錄</text><rect x="788" y="20" width="140" height="32" rx="16" fill="#f5c877"/><text x="806" y="43" class="ink" font-size="19">示意圖</text><rect x="28" y="133" width="904" height="62" rx="14" class="teal"/><text x="48" y="172" class="accent" font-size="25">鎖定已收斂增量 i   →   不切換 Frame，只切換 Result type</text><rect x="28" y="217" width="410" height="242" rx="14" class="white"/><text x="50" y="257" class="accent" font-size="25">A  核對 SPCD 位移</text><text x="50" y="303" class="ink" font-size="25">Displacement → Z</text><text x="50" y="346" class="ink" font-size="22">Resolved in：Global</text><text x="50" y="389" class="ink" font-size="22">Node ID：驅動點（案例）</text><text x="50" y="430" class="muted" font-size="22">記錄 UZ_i，單位 mm</text><rect x="520" y="217" width="412" height="242" rx="14" class="white"/><text x="542" y="257" class="accent" font-size="25">B  讀取驅動反力</text><text x="542" y="303" class="ink" font-size="25">SPC Forces → Z</text><text x="542" y="346" class="ink" font-size="22">Resolved in：Global</text><text x="542" y="389" class="ink" font-size="22">同一 Node ID：驅動點</text><text x="542" y="430" class="muted" font-size="22">記錄帶符號 RZ_i，單位 N</text><path d="M452 336 L504 336" fill="none" stroke="#0c827b" stroke-width="3" /><path d="M495 328 L504 336 L495 344" fill="none" stroke="#0c827b" stroke-width="3"/><rect x="28" y="478" width="904" height="67" rx="14" class="warn"/><text x="50" y="507" class="orange" font-size="21">Contour → Apply → Measure／Nodal Contour 或 Node Query（依版本）</text><text x="50" y="534" class="orange" font-size="19">節點不可見可用 Visibility All；N/A 不等於零，Magnitude 不代替 Z。</text><text x="32" y="577" class="muted" font-size="17">工程流程示意｜不是 HyperView 截圖，也不是本案新求解數據</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">SPCFORCE｜分端取力，再查等效與平衡</title><desc id="desc">驗證方法與預期符號示意・不是本案例實測反力・約 490 N 尚待輸出確認。請用帶符號 Z 分量；多支承先轉共同座標再加總，不重複計入 RBE／內部 Contact force。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif;fill:#223247}.title{font-size:27px;font-weight:700}.sub{font-size:17px;fill:#52657a}.body{font-size:20px}.small{font-size:17px}.label{font-size:22px;font-weight:700}.value{font-size:29px;font-weight:700;fill:#0f766e}.number{font-size:19px;font-weight:700;fill:white}.warn{font-size:20px;fill:#9a3412;font-weight:700}</style><rect width="1100" height="620" fill="#f8fafc"/><text x="40" y="48" class="title">SPCFORCE｜分端取力，再查等效與平衡</text><text x="40" y="80" class="sub">驗證方法與預期符號示意・不是本案例實測反力・約 490 N 尚待輸出確認</text><line x1="40" y1="101" x2="1060" y2="101" stroke="#cbd5e1"/><rect x="40" y="130" width="1020" height="166" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="68" y="170" class="label">SPCD 版本：統一為治具施於結構的力</text><text x="68" y="215" class="label">驅動端 26088</text><text x="756" y="215" class="label">右端支承集合</text><text x="68" y="261" class="value">預期 FZ ≈ −490 N</text><text x="756" y="261" class="value">預期 ΣFZ ≈ +490 N</text><line x1="470" y1="236" x2="625" y2="236" stroke="#0f766e" stroke-width="5"/><text x="495" y="220" class="label">Rail</text><rect x="40" y="321" width="495" height="217" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/><text x="65" y="362" class="label">等效誤差（另查方向）</text><text x="65" y="409" class="small">eF = ||Fdrive,Z| − 490| / 490 × 100%</text><text x="65" y="446" class="small">比較驅動端與支承端，各自對照。</text><text x="65" y="483" class="small">1% 僅可當示例，須先定團隊門檻。</text><rect x="565" y="321" width="495" height="217" rx="12" fill="#eaf2fc" stroke="#cbd5e1"/><text x="590" y="362" class="label">整體平衡（同一座標系）</text><text x="590" y="409" class="small">ΣFexternal,Z + ΣRSPC,Z ≈ 0</text><text x="590" y="446" class="small">SPCD 版 external 不含已移除的舊 FORCE。</text><text x="590" y="483" class="small">兩端相加近 0 N，不代表未施加拉伸力。</text><line x1="40" y1="562" x2="1060" y2="562" stroke="#cbd5e1"/><text x="40" y="596" class="small">請用帶符號 Z 分量；多支承先轉共同座標再加總，不重複計入 RBE／內部 Contact force。</text></svg>